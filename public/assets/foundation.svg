<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <pattern id="rebarPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <line x1="0" y1="10" x2="20" y2="10" stroke="#475569" stroke-width="2.5"/>
      <line x1="10" y1="0" x2="10" y2="20" stroke="#475569" stroke-width="2.5"/>
      <circle cx="10" cy="10" r="2.5" fill="#f59e0b"/>
    </pattern>
  </defs>
  <rect width="600" height="450" fill="url(#sky2)"/>
  
  <!-- Trenches & Shuttering -->
  <polygon points="0,220 600,210 600,450 0,450" fill="#78350f"/>

  <!-- Concrete Base PCC -->
  <polygon points="60,240 540,230 570,410 30,420" fill="#94a3b8" stroke="#475569" stroke-width="2"/>

  <!-- Steel Rebar Grid Layer -->
  <polygon points="80,250 520,240 550,390 50,400" fill="url(#rebarPattern)" stroke="#334155" stroke-width="3"/>

  <!-- Column Starter Bars / Dowels sticking out -->
  <g stroke="#334155" stroke-width="3" stroke-linecap="round">
    <!-- Col 1 -->
    <line x1="150" y1="340" x2="145" y2="180"/>
    <line x1="155" y1="340" x2="150" y2="180"/>
    <line x1="165" y1="340" x2="160" y2="180"/>
    <line x1="170" y1="340" x2="165" y2="180"/>
    <!-- Col 2 -->
    <line x1="320" y1="330" x2="315" y2="160"/>
    <line x1="325" y1="330" x2="320" y2="160"/>
    <line x1="335" y1="330" x2="330" y2="160"/>
    <line x1="340" y1="330" x2="335" y2="160"/>
    <!-- Col 3 -->
    <line x1="470" y1="320" x2="465" y2="180"/>
    <line x1="475" y1="320" x2="470" y2="180"/>
    <line x1="485" y1="320" x2="480" y2="180"/>
    <line x1="490" y1="320" x2="485" y2="180"/>
  </g>

  <!-- Photo Stamp Overlay -->
  <rect x="20" y="380" width="310" height="50" rx="6" fill="#0f172a" fill-opacity="0.85"/>
  <circle cx="40" cy="405" r="8" fill="#3b82f6"/>
  <text x="56" y="398" fill="#ffffff" font-family="'Segoe UI'" font-size="11" font-weight="bold">RAFT FOUNDATION &amp; REBAR MESH</text>
  <text x="56" y="415" fill="#cbd5e1" font-family="'Courier New'" font-size="10">25-AUG-2026 | 16mm High-Yield Steel</text>
</svg>
