<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <pattern id="brickHatch" width="16" height="8" patternUnits="userSpaceOnUse">
      <path d="M 0 0 L 16 0 M 0 8 L 16 8 M 0 0 L 0 8 M 8 0 L 8 4 M 16 0 L 16 8" stroke="#334155" stroke-width="0.5" fill="none"/>
    </pattern>
    <pattern id="louverGrid" width="6" height="40" patternUnits="userSpaceOnUse">
      <line x1="3" y1="0" x2="3" y2="40" stroke="#b45309" stroke-width="2"/>
    </pattern>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- Sky & Ground -->
  <rect width="800" height="600" fill="url(#skyGrad)"/>
  <rect x="0" y="480" width="800" height="120" fill="#334155"/>
  <line x1="0" y1="480" x2="800" y2="480" stroke="#0f172a" stroke-width="4"/>
  <text x="30" y="505" fill="#94a3b8" font-family="'Courier New'" font-size="11" font-weight="bold">NATURAL GROUND LEVEL (NGL) ± 0.00 M</text>

  <!-- Building Massing -->
  <!-- Ground Floor -->
  <rect x="160" y="320" width="480" height="160" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>
  <!-- First Floor -->
  <rect x="180" y="180" width="440" height="140" fill="#f8fafc" stroke="#1e293b" stroke-width="3"/>
  <!-- Terrace Parapet & Pergola -->
  <rect x="180" y="140" width="440" height="40" fill="none" stroke="#1e293b" stroke-width="2.5"/>

  <!-- Timber Screen / Louvers Element -->
  <rect x="220" y="190" width="130" height="120" fill="url(#louverGrid)" stroke="#78350f" stroke-width="2"/>
  <rect x="215" y="185" width="140" height="130" fill="none" stroke="#b45309" stroke-width="2"/>

  <!-- Cantilever Balcony -->
  <rect x="370" y="270" width="230" height="14" fill="#0f172a"/>
  <!-- Glass Railing -->
  <rect x="370" y="225" width="230" height="45" fill="#38bdf8" fill-opacity="0.25" stroke="#0284c7" stroke-width="1.5"/>
  <line x1="445" y1="225" x2="445" y2="270" stroke="#0284c7" stroke-width="1.5"/>
  <line x1="520" y1="225" x2="520" y2="270" stroke="#0284c7" stroke-width="1.5"/>

  <!-- Large Ribbon Glazing -->
  <rect x="390" y="200" width="190" height="65" fill="#0f172a" stroke="#0284c7" stroke-width="2"/>
  <line x1="485" y1="200" x2="485" y2="265" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Ground Floor Double Door Entrance -->
  <rect x="230" y="360" width="110" height="120" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
  <rect x="240" y="370" width="40" height="100" fill="#b45309"/>
  <rect x="290" y="370" width="40" height="100" fill="#b45309"/>

  <!-- Large Picture Windows Ground Floor -->
  <rect x="380" y="360" width="220" height="90" fill="#1e293b" stroke="#0284c7" stroke-width="2"/>
  <line x1="450" y1="360" x2="450" y2="450" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="530" y1="360" x2="530" y2="450" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Level Markers (Architectural Elevation style) -->
  <!-- Roof Top -->
  <line x1="630" y1="140" x2="720" y2="140" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="3 3"/>
  <polygon points="720,140 730,135 730,145" fill="#ef4444"/>
  <text x="735" y="144" fill="#ef4444" font-family="'Courier New'" font-size="11" font-weight="bold">+ 10.20 M TOP OF PARAPET</text>

  <!-- First Floor Slab -->
  <line x1="630" y1="180" x2="720" y2="180" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="3 3"/>
  <polygon points="720,180 730,175 730,185" fill="#ef4444"/>
  <text x="735" y="184" fill="#ef4444" font-family="'Courier New'" font-size="11" font-weight="bold">+ 6.80 M SECOND FLOOR</text>

  <!-- Mid Floor -->
  <line x1="650" y1="320" x2="720" y2="320" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="3 3"/>
  <polygon points="720,320 730,315 730,325" fill="#ef4444"/>
  <text x="735" y="324" fill="#ef4444" font-family="'Courier New'" font-size="11" font-weight="bold">+ 3.40 M FIRST FLOOR</text>

  <!-- Plinth Level -->
  <line x1="650" y1="470" x2="720" y2="470" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="3 3"/>
  <polygon points="720,470 730,465 730,475" fill="#ef4444"/>
  <text x="735" y="474" fill="#ef4444" font-family="'Courier New'" font-size="11" font-weight="bold">+ 0.60 M PLINTH LVL</text>

  <!-- Human Figure for Scale -->
  <circle cx="130" cy="425" r="7" fill="#64748b"/>
  <line x1="130" y1="432" x2="130" y2="460" stroke="#64748b" stroke-width="3"/>
  <line x1="130" y1="460" x2="124" y2="480" stroke="#64748b" stroke-width="2.5"/>
  <line x1="130" y1="460" x2="136" y2="480" stroke="#64748b" stroke-width="2.5"/>
  <line x1="120" y1="442" x2="140" y2="442" stroke="#64748b" stroke-width="2"/>

  <!-- Title Block -->
  <rect x="40" y="40" width="280" height="70" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
  <text x="50" y="60" fill="#64748b" font-family="'Segoe UI'" font-size="10" font-weight="bold">ATELIER ARCHITECTURE STUDIO</text>
  <text x="50" y="78" fill="#0f172a" font-family="'Segoe UI'" font-size="13" font-weight="bold">NORTH FRONT ELEVATION</text>
  <text x="50" y="95" fill="#2563eb" font-family="'Courier New'" font-size="10">DRG: ARC-SR-201 | REV: R01 | SCALE 1:100</text>
</svg>
