<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="colSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#colSky)"/>

  <!-- Plinth beam / slab surface -->
  <polygon points="0,320 600,310 600,450 0,450" fill="#64748b"/>
  <polygon points="20,330 580,320 590,440 10,445" fill="#475569"/>

  <!-- Casted Concrete Columns with ply shuttering boards & props -->
  <!-- Column 1 (Stripped Concrete) -->
  <rect x="100" y="100" width="45" height="230" fill="#cbd5e1" stroke="#334155" stroke-width="2"/>
  <text x="105" y="160" fill="#475569" font-family="'Courier New'" font-size="10" transform="rotate(90 105 160)">C1-450x300</text>
  <!-- Rebar extending on top -->
  <line x1="110" y1="100" x2="108" y2="60" stroke="#334155" stroke-width="3"/>
  <line x1="125" y1="100" x2="125" y2="55" stroke="#334155" stroke-width="3"/>
  <line x1="135" y1="100" x2="137" y2="60" stroke="#334155" stroke-width="3"/>

  <!-- Column 2 (Timber Shuttering in place) -->
  <rect x="270" y="90" width="50" height="235" fill="#b45309" stroke="#78350f" stroke-width="2"/>
  <!-- Clamps / steel yokes -->
  <rect x="265" y="120" width="60" height="10" fill="#0f172a"/>
  <rect x="265" y="160" width="60" height="10" fill="#0f172a"/>
  <rect x="265" y="200" width="60" height="10" fill="#0f172a"/>
  <rect x="265" y="240" width="60" height="10" fill="#0f172a"/>
  <rect x="265" y="280" width="60" height="10" fill="#0f172a"/>
  <!-- Diagonal Acrow Prop Support -->
  <line x1="280" y1="180" x2="210" y2="330" stroke="#0284c7" stroke-width="5" stroke-linecap="round"/>
  <line x1="310" y1="220" x2="380" y2="330" stroke="#0284c7" stroke-width="5" stroke-linecap="round"/>

  <!-- Column 3 (Freshly poured) -->
  <rect x="450" y="110" width="45" height="210" fill="#cbd5e1" stroke="#334155" stroke-width="2"/>
  <line x1="460" y1="110" x2="458" y2="70" stroke="#334155" stroke-width="3"/>
  <line x1="475" y1="110" x2="475" y2="65" stroke="#334155" stroke-width="3"/>
  <line x1="485" y1="110" x2="487" y2="70" stroke="#334155" stroke-width="3"/>

  <!-- Photo Stamp Overlay -->
  <rect x="20" y="380" width="310" height="50" rx="6" fill="#0f172a" fill-opacity="0.85"/>
  <circle cx="40" cy="405" r="8" fill="#f59e0b"/>
  <text x="56" y="398" fill="#ffffff" font-family="'Segoe UI'" font-size="11" font-weight="bold">GROUND FLOOR COLUMNS CASTING</text>
  <text x="56" y="415" fill="#cbd5e1" font-family="'Courier New'" font-size="10">05-SEP-2026 | M25 Vibrated Concrete</text>
</svg>
