<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <pattern id="cadGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#2563eb" stroke-width="0.3" stroke-opacity="0.25"/>
    </pattern>
    <pattern id="cadMajorGrid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#2563eb" stroke-width="0.8" stroke-opacity="0.4"/>
    </pattern>
    <style>
      .bg { fill: #0d1b2a; }
      .grid-layer { fill: url(#cadGrid); }
      .major-grid { fill: url(#cadMajorGrid); }
      .wall { stroke: #60a5fa; stroke-width: 4; fill: #1e3a8a; fill-opacity: 0.2; }
      .inner-wall { stroke: #93c5fd; stroke-width: 2.5; fill: none; }
      .door-swing { stroke: #38bdf8; stroke-width: 1.2; stroke-dasharray: 3 3; fill: none; }
      .dim-line { stroke: #f59e0b; stroke-width: 1; stroke-dasharray: 2 2; }
      .dim-text { fill: #fbbf24; font-family: 'Courier New', monospace; font-size: 11px; font-weight: bold; }
      .room-label { fill: #f8fafc; font-family: 'Segoe UI', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 1px; }
      .room-dim { fill: #94a3b8; font-family: 'Courier New', monospace; font-size: 10px; }
      .title-block { stroke: #3b82f6; stroke-width: 1.5; fill: #0f172a; }
    </style>
  </defs>

  <!-- Background blueprint -->
  <rect width="800" height="600" class="bg"/>
  <rect width="800" height="600" class="grid-layer"/>
  <rect width="800" height="600" class="major-grid"/>

  <!-- Border & Margins -->
  <rect x="25" y="25" width="750" height="550" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <rect x="30" y="30" width="740" height="540" fill="none" stroke="#1d4ed8" stroke-width="0.8"/>

  <!-- External Walls -->
  <polygon points="100,100 680,100 680,480 420,480 420,520 220,520 220,480 100,480" class="wall"/>

  <!-- Interior Partitions -->
  <!-- Master Bedroom -->
  <line x1="100" y1="280" x2="360" y2="280" class="inner-wall"/>
  <line x1="360" y1="100" x2="360" y2="280" class="inner-wall"/>

  <!-- Living & Double Height Atrium -->
  <line x1="360" y1="360" x2="680" y2="360" class="inner-wall"/>
  <line x1="480" y1="100" x2="480" y2="260" class="inner-wall"/>

  <!-- Kitchen & Dining -->
  <line x1="480" y1="260" x2="680" y2="260" class="inner-wall"/>

  <!-- Staircase core -->
  <rect x="370" y="270" width="100" height="85" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="370" y1="285" x2="470" y2="285" stroke="#38bdf8" stroke-width="1"/>
  <line x1="370" y1="300" x2="470" y2="300" stroke="#38bdf8" stroke-width="1"/>
  <line x1="370" y1="315" x2="470" y2="315" stroke="#38bdf8" stroke-width="1"/>
  <line x1="370" y1="330" x2="470" y2="330" stroke="#38bdf8" stroke-width="1"/>
  <line x1="370" y1="345" x2="470" y2="345" stroke="#38bdf8" stroke-width="1"/>
  <!-- UP Arrow -->
  <path d="M 420 345 L 420 280 M 415 290 L 420 280 L 425 290" stroke="#38bdf8" stroke-width="1.5" fill="none"/>
  <text x="430" y="320" fill="#38bdf8" font-family="'Courier New'" font-size="9" font-weight="bold">UP</text>

  <!-- Doors & swings -->
  <path d="M 240 280 A 40 40 0 0 0 280 240" class="door-swing"/>
  <line x1="240" y1="280" x2="280" y2="280" stroke="#38bdf8" stroke-width="1.8"/>

  <path d="M 480 320 A 40 40 0 0 1 520 360" class="door-swing"/>
  <line x1="480" y1="360" x2="480" y2="320" stroke="#38bdf8" stroke-width="1.8"/>

  <!-- Main Entrance -->
  <polygon points="320,520 320,515 360,515 360,520" fill="#38bdf8"/>
  <text x="300" y="540" fill="#38bdf8" font-family="'Courier New'" font-size="10" font-weight="bold">ENTRY PORCH</text>

  <!-- Furniture & fixtures layout -->
  <!-- Master Bed -->
  <rect x="130" y="140" width="90" height="90" fill="none" stroke="#60a5fa" stroke-width="1.2"/>
  <rect x="140" y="145" width="30" height="20" fill="#1e3a8a" stroke="#60a5fa" stroke-width="0.8"/>
  <rect x="180" y="145" width="30" height="20" fill="#1e3a8a" stroke="#60a5fa" stroke-width="0.8"/>
  <line x1="130" y1="180" x2="220" y2="180" stroke="#60a5fa" stroke-width="0.8"/>

  <!-- Living Sofas -->
  <rect x="520" y="390" width="120" height="50" rx="4" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1"/>
  <rect x="550" y="415" width="60" height="20" rx="2" fill="none" stroke="#93c5fd" stroke-width="0.8"/>

  <!-- Dining Table -->
  <circle cx="580" cy="180" r="35" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1"/>
  <circle cx="580" cy="135" r="7" fill="none" stroke="#93c5fd"/>
  <circle cx="580" cy="225" r="7" fill="none" stroke="#93c5fd"/>
  <circle cx="535" cy="180" r="7" fill="none" stroke="#93c5fd"/>
  <circle cx="625" cy="180" r="7" fill="none" stroke="#93c5fd"/>

  <!-- Double Height Void Cross -->
  <line x1="370" y1="110" x2="470" y2="250" stroke="#f43f5e" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="470" y1="110" x2="370" y2="250" stroke="#f43f5e" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="385" y="185" fill="#f43f5e" font-family="'Courier New'" font-size="10" font-weight="bold">VOID ABOVE</text>

  <!-- Labels -->
  <text x="180" y="240" class="room-label">MASTER SUITE</text>
  <text x="180" y="255" class="room-dim">4.80m x 4.20m</text>

  <text x="540" y="380" class="room-label">LIVING LOUNGE</text>
  <text x="540" y="395" class="room-dim">6.20m x 4.50m</text>

  <text x="540" y="160" class="room-label">DINING &amp; KITCHEN</text>
  <text x="540" y="175" class="room-dim">5.10m x 3.60m</text>

  <text x="160" y="380" class="room-label">FAMILY FOYER</text>
  <text x="160" y="395" class="room-dim">3.60m x 3.20m</text>

  <!-- Dimensions -->
  <line x1="100" y1="80" x2="680" y2="80" class="dim-line"/>
  <line x1="100" y1="75" x2="100" y2="85" stroke="#f59e0b" stroke-width="1.5"/>
  <line x1="680" y1="75" x2="680" y2="85" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="365" y="75" class="dim-text">17.40 M</text>

  <line x1="705" y1="100" x2="705" y2="480" class="dim-line"/>
  <line x1="700" y1="100" x2="710" y2="100" stroke="#f59e0b" stroke-width="1.5"/>
  <line x1="700" y1="480" x2="710" y2="480" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="715" y="295" class="dim-text" transform="rotate(90 715 295)">11.40 M</text>

  <!-- Architectural Title Block -->
  <rect x="520" y="475" width="240" height="85" class="title-block"/>
  <text x="530" y="495" fill="#93c5fd" font-family="'Segoe UI'" font-size="10" font-weight="bold" letter-spacing="1">ATELIER ARCHITECTURE STUDIO</text>
  <text x="530" y="515" fill="#ffffff" font-family="'Segoe UI'" font-size="12" font-weight="bold">SHARMA RESIDENCE — GF PLAN</text>
  <text x="530" y="532" fill="#38bdf8" font-family="'Courier New'" font-size="10">DRG NO: ARC-SR-101 | REV: R02</text>
  <text x="530" y="548" fill="#94a3b8" font-family="'Courier New'" font-size="9">SCALE: 1:100 @ A3 | DATE: 28-AUG-2026</text>
</svg>
